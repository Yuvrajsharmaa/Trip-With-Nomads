name: repo-verify

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'codex/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repo guard + secret scan
        run: npm run verify
