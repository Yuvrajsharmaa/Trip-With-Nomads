name = "twn-checkout-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-25"
workers_dev = true
routes = [
  { pattern = "tripwithnomads.com/api/checkout/*", zone_name = "tripwithnomads.com" },
  { pattern = "www.tripwithnomads.com/api/checkout/*", zone_name = "tripwithnomads.com" }
]

[vars]
CHECKOUT_ALLOWED_ORIGINS = "https://tripwithnomads.com,https://www.tripwithnomads.com,https://maroon-aside-814100.framer.app,http://localhost:3000,http://127.0.0.1:3000"
CHECKOUT_MAX_BODY_BYTES = "65536"
CHECKOUT_RATE_LIMIT_WINDOW_SEC = "60"
CHECKOUT_RATE_LIMIT_WRITE_LIMIT = "40"

# Required secrets (set via `wrangler secret put`):
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
